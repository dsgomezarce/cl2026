<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@700;800&family=Montserrat:wght@500;600&display=swap">
<style>
html,body{margin:0}
.c{width:1200px;height:630px;background:#fff;display:grid;grid-template-columns:470px 1fr;align-items:center;gap:0;box-sizing:border-box;border-bottom:14px solid #0e356b;position:relative;overflow:hidden}
.c::before{content:"";position:absolute;right:-140px;top:-140px;width:520px;height:520px;border-radius:50%;background:#e6eef8}
.l{display:grid;place-items:center;height:100%;border-right:2px solid #dbe3ee;padding:40px}
.l img{width:390px;height:auto}
.r{position:relative;min-width:0;padding:0 50px;display:grid;gap:14px}
.ey{font:600 19px/1.2 Montserrat,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#5a6b82}
h1{margin:0;font:800 78px/0.95 "Kumbh Sans",sans-serif;letter-spacing:.01em;text-transform:uppercase;color:#0e356b}
.d{font:500 25px/1.35 Montserrat,sans-serif;color:#0b1a2e;text-wrap:balance;max-width:560px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.chips span{font:600 16px/1 Montserrat,sans-serif;letter-spacing:.05em;text-transform:uppercase;color:#fff;background:#0e356b;border-radius:999px;padding:10px 16px}
</style></head><body>
<div class="c"><div class="l"><img src="__LOGO__" alt=""></div>
<div class="r"><div class="ey">Punta Cana · 7 al 9 de octubre de 2026</div><h1>Leaderboard</h1>
<div class="d">Resultados del XVIII Campeonato Latinoamericano de Golf</div>
<div class="chips"><span>Naciones</span><span>Categorías</span><span>Seniors</span><span>Interclubes</span></div></div></div>
</body></html>
