<title>Leaderboard Comité CL 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@600;700;800&family=Varela+Round&family=Montserrat:wght@400;500;600;700&family=Noto+Color+Emoji&display=swap">
<style>
/* Layout: leaderboard de golf en la identidad del Comité: blanco, azul marino y cian; barra de rondas fija, secciones apiladas con tablas de posiciones. */
:root{
  --bg:#ffffff; --surface:#f4f7fb; --fg:#0b1a2e; --muted:#5a6b82; --line:#dbe3ee;
  --accent:#0e356b; --accent-2:#174d99; --cyan:#00cfff; --accent-soft:#e6eef8; --on-accent:#ffffff;
  --under:#c8102e; --nc:#a3afbf; --ok:#0f7a52; --ok-soft:#e3f5ee; --warn:#a15c00; --warn-soft:#fff3e0;
  --display:"Kumbh Sans","Montserrat",system-ui,sans-serif; --sub:"Varela Round","Montserrat",system-ui,sans-serif; --body:"Montserrat",system-ui,sans-serif;
  color-scheme:light;
}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding-inline:20px;padding-block:28px 56px;display:grid;gap:26px}
header{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.logo{width:min(100%,300px);height:auto;flex:none}
.titles{min-width:0;flex:1 1 260px;display:grid;gap:4px}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:clamp(1.6rem,4vw,2.3rem);font-weight:800;line-height:1.1;text-transform:uppercase;letter-spacing:.02em;color:var(--accent)}
.sub{color:var(--muted)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px;border-top:3px solid var(--accent);border-bottom:1px solid var(--line);display:grid;gap:10px}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1.5px solid var(--accent);border-radius:999px;overflow:hidden;width:100%}
.seg button{all:unset;cursor:pointer;text-align:center;padding:9px 6px;font-weight:700;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.seg button+button{border-left:1px solid var(--accent)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.seg button:focus-visible{outline:3px solid var(--cyan);outline-offset:-3px}
.seg small{display:block;font-weight:500;font-size:.62rem;letter-spacing:.04em;text-transform:none;opacity:.8}
.nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.nav a{flex:none;font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;color:var(--accent-2);border:1.5px solid var(--line);border-radius:999px;padding:5px 11px}
.nav a:hover,.nav a:focus-visible{border-color:var(--accent-2);outline:none}
.status{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.85rem;color:var(--muted)}
.pill{font-size:.72rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.pill.live{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.wait{background:var(--warn-soft);color:var(--warn);border-color:transparent}
section.board{display:grid;gap:10px;scroll-margin-top:130px}
.board>.hd{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h2{font-size:1.2rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.board>.hd span{font-size:.78rem;color:var(--muted)}
h3{font-family:var(--display);font-weight:800;font-size:.9rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-2);margin-top:6px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.9rem}
thead th{background:var(--accent);color:var(--on-accent);font-size:.66rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;text-align:center;padding:7px 8px;white-space:nowrap}
thead th.l{text-align:left}
td{padding:7px 8px;border-top:1px solid var(--line);text-align:center;white-space:nowrap}
td.l{text-align:left;white-space:normal;min-width:180px}
td.pos{font-weight:700;color:var(--accent);width:44px}
td.par{font-family:var(--display);font-weight:800;font-size:1.02rem;width:62px}
.u{color:var(--under)}
.e{color:var(--fg)}
.ev{color:#0f7a52}
td.u:not(.par),td.ev:not(.par){font-weight:700}
.sum small.u{color:var(--under)}
.sum small.ev{color:#0f7a52}
.nm b{font-weight:700}
.cc{display:inline-block;margin-left:6px;font-size:.66rem;font-weight:700;letter-spacing:.06em;color:var(--accent-2);background:var(--accent-soft);border-radius:4px;padding:1px 5px;vertical-align:1px}
.tag{display:inline-block;margin-left:4px;font-size:.62rem;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;vertical-align:1px}
.adj{font-size:.66rem;color:var(--ok);font-weight:700;margin-left:2px}
td.dim{color:var(--muted)}
tbody tr.top td.pos{color:var(--on-accent);background:var(--accent)}
tr.team td{background:var(--surface);border-top:2px solid var(--accent)}
tr.team td.l{white-space:nowrap}
@media (max-width:600px){tr.team td.l{white-space:normal}.tg{align-items:center}.tg b{text-wrap:balance}}
tr.team td.l b{font-family:var(--sub);font-weight:700;font-size:1.02rem;color:var(--accent)}
tr.mem td{font-size:.84rem;border-top:1px dashed var(--line);padding-block:4px}
tr.mem td.l{padding-left:22px}
.cnt{font-weight:700;color:var(--fg)}
.cnt.u{color:var(--under)}
.cnt.ev{color:#0f7a52}
.nc{color:var(--nc);text-decoration:line-through;text-decoration-color:var(--under);text-decoration-thickness:1.5px}
.note{text-wrap:pretty;font-size:.8rem;color:var(--muted);margin:0}
.empty{padding:16px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:.9rem}
/* carga */
details.entry{border:1.5px solid var(--accent-2);border-radius:10px;padding:12px 16px;background:var(--surface)}
details.entry>summary{cursor:pointer;font-weight:700;color:var(--accent-2);font-size:.85rem;letter-spacing:.06em;text-transform:uppercase}
.entry .ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-block:12px}
.entry select,.entry input{font:inherit;font-size:.9rem;border:1.5px solid var(--line);border-radius:6px;padding:5px 7px;background:var(--bg);color:var(--fg)}
.entry input{width:64px;text-align:center}
.entry input:focus,.entry select:focus{outline:2px solid var(--cyan);border-color:var(--accent-2)}
.entry .grp{font-size:.72rem;font-weight:700;letter-spacing:.08em;color:var(--accent);text-transform:uppercase;padding-top:10px}
.entry td{padding:4px 6px}
.saved{font-size:.72rem;color:var(--ok);font-weight:600}
.err{font-size:.72rem;color:var(--under);font-weight:600}
footer{color:var(--muted);font-size:.82rem;border-top:1px solid var(--line);padding-top:18px;display:grid;gap:4px;text-align:center}
footer>div{text-wrap:balance}
footer .ft{font-family:var(--display);color:var(--accent);font-size:.95rem;letter-spacing:.06em;text-transform:uppercase}
footer .nb,.sub .nb{white-space:nowrap}
@media (max-width:600px){footer .dot{display:none} footer .nb{display:block}}
footer .fs{margin-top:6px;font-weight:700;color:var(--accent);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
@media (max-width:600px){
  .wrap{padding-inline:16px}
  td,thead th{padding-inline:6px}
  td.l{min-width:150px}
  .hide-s{display:none}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
html{scroll-behavior:smooth}
.cnav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin-inline:-2px;padding:2px}
.cnav::-webkit-scrollbar{display:none}
.cnav a{flex:1 0 auto;text-align:center;font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;text-decoration:none;color:var(--accent);background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:6px 11px;transition:background .15s,color .15s,border-color .15s}
.cnav a.l{min-width:2.1em;padding-inline:8px}
.cnav a:hover{border-color:var(--accent)}
.cnav a:focus-visible{outline:3px solid var(--cyan);outline-offset:1px}
.cnav a[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
@media (min-width:900px){.cnav a{font-size:.8rem;padding:7px 14px}}
@media (max-width:899px){
.cnav{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));overflow:visible;gap:5px}
.cnav a{padding:6px 2px;font-size:.68rem;letter-spacing:.05em}
.cnav a[href="#naciones"]{grid-column:1/3;grid-row:1}
.cnav a[href="#scratch"]{grid-column:3/5;grid-row:1}
.cnav a[href="#interclubes"]{grid-column:5/7;grid-row:1}
.cnav a[href="#campeones"]{grid-column:1/4;grid-row:3}
.cnav a[href="#medallero"]{grid-column:4/7;grid-row:3}
.cnav a.l,.cnav a[href="#cat-Damas"]{grid-row:2;min-width:0}
}
@media (max-width:899px){
.bar{padding-block:8px;gap:7px}
.seg button{padding:7px 4px;font-size:.78rem;display:flex;justify-content:center;align-items:baseline;gap:5px}
.seg small{display:inline;font-size:.62rem}
.seg button[data-v="tot"] small{display:none}
.cnav{gap:4px}
.cnav a{padding:4px 2px;font-size:.64rem;border-width:1px}
}
/* cabecera fija que se achica */

.topin{max-width:1040px;margin:0 auto;padding-inline:20px;padding-top:28px;display:grid;gap:26px;transition:padding .35s ease,gap .35s ease}
.top .bar{position:static}
.wrap{padding-top:calc(var(--toph,330px) + 26px)}
.logo{transition:width .35s ease,opacity .15s;cursor:pointer}
.logo:active{opacity:.6}
.logo:focus-visible{outline:3px solid var(--cyan);outline-offset:4px;border-radius:4px}
header{transition:gap .35s ease}
.titles{transition:flex-basis .35s ease}
.eyebrow,.titles .sub{max-height:4.5em;overflow:hidden;transition:max-height .3s ease,opacity .25s ease}

.top.mini{box-shadow:0 6px 18px -12px rgba(15,35,70,.45)}

.top.mini header{flex-wrap:nowrap;justify-content:space-between;gap:12px}

.top.mini .eyebrow,.top.mini .titles .sub{max-height:0;opacity:0}
.top.mini h1{font-size:1.25rem;letter-spacing:.08em}
.rpill{all:unset;display:inline-block;justify-self:end;cursor:pointer;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:0 12px;max-height:0;opacity:0;overflow:hidden;transition:max-height .3s ease,opacity .25s ease,padding .3s ease,margin .3s ease}
.rpill:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.top.mini .rpill{max-height:2.4em;opacity:1;padding:4px 12px;margin-top:4px}
.top.mini .titles{display:grid;justify-items:end}
.seg{max-height:5em;transition:max-height .35s ease,opacity .25s ease,border-width .35s ease}
.bar{transition:gap .35s ease,padding .35s ease}
.top.mini .seg{max-height:0;opacity:0;border-width:0}

.top.notr,.top.notr *{transition:none!important}
.seg button{transition:padding .35s ease}
.top.mini .seg button{padding-block:6px;display:flex;justify-content:center;align-items:baseline;gap:6px}
.top.mini .seg small{display:inline}
@media (min-width:900px){.top.mini .logo{width:182px}.top.mini h1{font-size:1.5rem}}

section.board{scroll-margin-top:var(--barh,140px)}

</style>
<style>
